<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SAP BTP AI</title>
    <link rel="stylesheet" href="sap-template.css" />
    <style>
      :root {
        --sap-blue: #0a6ed1;
        --ink: #102a43;
        --muted: #526f89;
        --line: #c5ddeb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #102a43;
        font-family: Arial, "SAP 72", sans-serif;
      }
      .slide {
        position: relative;
        width: min(100vw, 1600px);
        min-height: 900px;
        margin: auto;
        overflow: hidden;
        padding: 76px 110px 72px;
        background:
          radial-gradient(
            circle at 90% 84%,
            rgba(117, 188, 233, 0.18),
            transparent 24%
          ),
          #f8fbff;
        color: var(--ink);
      }
      .top-line {
        position: absolute;
        inset: 0 0 auto;
        height: 9px;
        background: var(--sap-blue);
      }
      .brand {
        position: absolute;
        top: 44px;
        right: 78px;
        color: #173b5b;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand b,
      h1 span {
        color: var(--sap-blue);
      }
      .kicker {
        margin: 0 0 22px;
        color: var(--sap-blue);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.11em;
      }
      h1 {
        margin: 0;
        font-size: clamp(38px, 2.9vw, 46px);
        line-height: 1.05;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }

      .architecture {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 570px;
        margin-top: 34px;
        padding: 14px;
        border: 1px solid #c5ddeb;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(28, 68, 102, 0.08);
        overflow: hidden;
      }
      .architecture img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .demo-next {
        position: absolute;
        right: 110px;
        bottom: 31px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #39779d;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.09em;
      }
      .demo-next:before {
        width: 34px;
        height: 2px;
        background: var(--sap-blue);
        content: "";
      }
      .footer {
        position: absolute;
        left: 110px;
        bottom: 30px;
        color: #637994;
        font-size: 14px;
        font-weight: 700;
      }

      @media (max-width: 800px) {
        .slide {
          min-height: 100vh;
          padding: 72px 30px 84px;
        }
        .brand {
          top: 28px;
          right: 30px;
          font-size: 13px;
        }
        .architecture {
          height: 400px;
        }
        .footer {
          left: 30px;
        }
        .demo-next {
          right: 30px;
          bottom: 31px;
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="slide">
      <div class="top-line"></div>
      <div class="brand">SAP BTP AI</div><p class="kicker">25 · APP-IN-APP PORTAL</p>
      <h1>SAP BTP Kyma 기반 <span>App-in-App Portal 아키텍처</span></h1>

      <section class="architecture" aria-label="App-in-App Portal Kyma Runtime implementation architecture">
        <img src="assets/app-in-app-kyma-architecture.svg" alt="App-in-App Portal과 Kyma Runtime, SAP BTP AI Core, HANA Knowledge Graph, Joule의 구현 아키텍처" />
      </section>

      <span class="footer">SAP | BTP AI Solution Advisory</span>
      <span class="slide-page-number">25</span>
      <span class="demo-next">DEMO · APP-IN-APP PORTAL</span>
    </main>
  </body>
</html>
