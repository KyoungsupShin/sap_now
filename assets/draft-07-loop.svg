<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 500" role="img" aria-labelledby="title desc"><title id="title">A controlled agent execution loop</title><desc id="desc">Six stages form a clockwise loop: Understand, Retrieve, Reason, Plan, Execute and Validate. The agent repeats the loop or escalates to a human when required.</desc><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#51beff"/><stop offset=".52" stop-color="#0070f2"/><stop offset="1" stop-color="#4034b8"/></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#e8e5ff"/></linearGradient><linearGradient id="step" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b90ff"/><stop offset="1" stop-color="#0057c2"/></linearGradient><radialGradient id="halo"><stop stop-color="#cce9ff" stop-opacity=".9"/><stop offset="1" stop-color="#eff8ff" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9" fill="none" stroke="#0070f2" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><ellipse cx="690" cy="247" rx="360" ry="242" fill="url(#halo)"/><ellipse cx="690" cy="247" rx="264" ry="177" fill="none" stroke="#d9eaff" stroke-width="30"/><path d="M749.3870783467803 74.53649853301337 A264 177 0 0 1 883.077377227461 126.28629026893778" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="690.0" cy="70.0" r="28" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="690.0" y="76.0" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">01</text><text x="690.0" y="27.0" text-anchor="middle" font-size="26" fill="#1d2d3e" font-weight="600">Understand</text><path d="M942.4644555742414 195.25020826407558 A264 177 0 0 1 942.4644555742414 298.7497917359244" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="918.6307065990918" cy="158.5" r="28" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="918.6307065990918" y="164.5" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">02</text><text x="973.6307065990918" y="165.5" text-anchor="start" font-size="26" fill="#1d2d3e" font-weight="600">Retrieve</text><path d="M883.077377227461 367.71370973106224 A264 177 0 0 1 749.3870783467803 419.4635014669866" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="918.6307065990918" cy="335.5" r="28" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="918.6307065990918" y="341.5" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">03</text><text x="973.6307065990918" y="342.5" text-anchor="start" font-size="26" fill="#1d2d3e" font-weight="600">Reason</text><path d="M630.6129216532196 419.4635014669866 A264 177 0 0 1 496.922622772539 367.71370973106224" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="690.0" cy="424.0" r="28" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="690.0" y="430.0" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">04</text><text x="690.0" y="482.0" text-anchor="middle" font-size="26" fill="#1d2d3e" font-weight="600">Plan</text><path d="M437.53554442575864 298.74979173592436 A264 177 0 0 1 437.53554442575864 195.25020826407558" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="461.3692934009082" cy="335.5" r="28" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="461.3692934009082" y="341.5" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">05</text><text x="406.3692934009082" y="342.5" text-anchor="end" font-size="26" fill="#1d2d3e" font-weight="600">Execute</text><path d="M496.92262277253894 126.28629026893779 A264 177 0 0 1 630.6129216532196 74.53649853301337" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="461.3692934009082" cy="158.5" r="28" fill="url(#blue)" stroke="white" stroke-width="4"/><text x="461.3692934009082" y="164.5" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">06</text><text x="406.3692934009082" y="165.5" text-anchor="end" font-size="26" fill="#1d2d3e" font-weight="600">Validate</text><g transform="translate(690 235) scale(0.9)"><ellipse cx="0" cy="58" rx="90" ry="20" fill="#0070f2" opacity=".08"/><path d="M0 -76 66 -38 66 38 0 76 -66 38 -66 -38Z" stroke="none" stroke-width="0" fill="url(#blue)" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -76 0 0 66 -38 M0 0 -66 -38 M0 0 0 76" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/><circle cx="0" cy="-5" r="27" fill="none" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-5" r="8" fill="#fff" stroke="none" stroke-width="2"/><path d="M 27.0 -5.0 L 41.0 -5.0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="41.0" cy="-5.0" r="4" fill="#fff" stroke="none" stroke-width="2"/><path d="M 13.500000000000004 18.38268590217984 L 20.500000000000004 30.507041555161983" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20.500000000000004" cy="30.507041555161983" r="4" fill="#fff" stroke="none" stroke-width="2"/><path d="M -13.499999999999995 18.382685902179844 L -20.49999999999999 30.50704155516199" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-20.49999999999999" cy="30.50704155516199" r="4" fill="#fff" stroke="none" stroke-width="2"/><path d="M -27.0 -4.9999999999999964 L -41.0 -4.999999999999995" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-41.0" cy="-4.999999999999995" r="4" fill="#fff" stroke="none" stroke-width="2"/><path d="M -13.500000000000012 -28.382685902179837 L -20.500000000000018 -40.507041555161976" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-20.500000000000018" cy="-40.507041555161976" r="4" fill="#fff" stroke="none" stroke-width="2"/><path d="M 13.500000000000004 -28.38268590217984 L 20.500000000000004 -40.50704155516198" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20.500000000000004" cy="-40.50704155516198" r="4" fill="#fff" stroke="none" stroke-width="2"/></g><text x="690" y="358" text-anchor="middle" font-size="22" fill="#0070f2" font-weight="600">Enterprise agent</text><path d="M435 172 H200 V243" stroke="#0070f2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrow)"/><text x="200" y="283" text-anchor="middle" font-size="21" fill="#1d2d3e" font-weight="400">Human decision</text><text x="200" y="310" text-anchor="middle" font-size="16" fill="#556b82" font-weight="400">When risk or policy requires</text></g></svg>