<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview</title><link rel="stylesheet" href="sap-template.css"><link rel="stylesheet" href="assets/sap-official-template.css"><style>
.slide.thumbnail-showcase { display:flex; align-items:center; justify-content:center; height:900px; padding:24px !important; overflow:hidden; }
.thumbnail-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; width:100%; max-width:1552px; }
.thumbnail-card { display:grid; grid-template-columns:108px minmax(0,1fr); gap:12px; align-items:center; margin:0; padding:12px; border:2px solid #0070f2; border-radius:3px; background:#fff; min-width:0; }
.thumbnail-card:nth-child(even) { grid-template-columns:minmax(0,1fr) 108px; }
.thumbnail-card figcaption { display:flex; align-items:center; justify-content:center; align-self:stretch; margin:0; padding-right:12px; border-right:1px solid #d6e5f5; color:#0070f2; font-size:24px; font-weight:500; line-height:1.35; text-align:center; }
.thumbnail-card:nth-child(even) figcaption { grid-column:2; grid-row:1; padding-right:0; padding-left:12px; border-right:0; border-left:1px solid #d6e5f5; }
.thumbnail-card img, .thumbnail-card video { display:block; box-sizing:border-box; width:100%; height:auto; aspect-ratio:8 / 5; object-fit:contain; background:#eef3f7; }
@media(max-width:800px) { .slide.thumbnail-showcase { height:auto; min-height:900px; padding:24px !important; } .thumbnail-pair { grid-template-columns:1fr; gap:24px; } .thumbnail-card, .thumbnail-card:nth-child(even) { grid-template-columns:1fr; } .thumbnail-card figcaption, .thumbnail-card:nth-child(even) figcaption { grid-column:1; grid-row:1; padding:0 0 12px; border:0; border-bottom:1px solid #d6e5f5; } .thumbnail-card figcaption br { display:none; } }
</style></head><body><main class="slide thumbnail-showcase"><div class="thumbnail-pair">
<figure class="thumbnail-card"><figcaption>Live<br>Assistant</figcaption><video autoplay muted loop playsinline preload="auto" poster="assets/thumbnails/live-assistant-poster.png" aria-label="Live Assistant"><source src="assets/thumbnails/live-assistant-native.mp4" type="video/mp4"></video></figure>
<figure class="thumbnail-card"><figcaption>App<br>Builder</figcaption><img src="assets/thumbnails/app-builder-chat-native-v2.gif" alt="App Builder" decoding="async"></figure>
<figure class="thumbnail-card"><figcaption>Harness</figcaption><img src="assets/thumbnails/harness-research-native-v2.gif" alt="Harness" decoding="async"></figure>
<figure class="thumbnail-card"><figcaption>Wiki<br>Agent</figcaption><img src="assets/thumbnails/wiki-query-kpi-native.gif" alt="Wiki Query · KPI" decoding="async"></figure>
</div></main></body></html>
