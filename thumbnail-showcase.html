<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview</title><link rel="stylesheet" href="sap-template.css"><link rel="stylesheet" href="assets/sap-official-template.css"><style>
.slide.thumbnail-showcase { display:flex; align-items:center; justify-content:center; height:900px; padding:24px !important; overflow:hidden; }
.thumbnail-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; width:100%; max-width:1376px; }
.thumbnail-card { position:relative; margin:0; min-width:0; }
.thumbnail-card figcaption { position:absolute; top:50%; left:-108px; transform:translateY(-50%); display:flex; align-items:center; justify-content:center; box-sizing:border-box; width:96px; min-height:88px; padding:12px 6px; margin:0; background:#eef6ff; border:1px solid #b8d9ff; color:#0070f2; font-size:21px; font-weight:500; line-height:1.35; text-align:center; }
.thumbnail-card:nth-child(even) figcaption { left:auto; right:-108px; }
.thumbnail-card img, .thumbnail-card video { display:block; box-sizing:border-box; width:100%; height:auto; aspect-ratio:8 / 5; object-fit:contain; background:#eef3f7; border:2px solid #0070f2; border-radius:3px; }
@media(max-width:800px) { .slide.thumbnail-showcase { height:auto; min-height:900px; padding:24px !important; } .thumbnail-pair { grid-template-columns:1fr; gap:24px; } .thumbnail-card figcaption, .thumbnail-card:nth-child(even) figcaption { position:static; transform:none; width:auto; min-height:0; padding:10px; margin-bottom:10px; } .thumbnail-card figcaption br { display:none; } }
</style></head><body><main class="slide thumbnail-showcase"><div class="thumbnail-pair">

<figure class="thumbnail-card"><figcaption>App<br>Builder</figcaption><img src="assets/thumbnails/app-builder-chat-native-v2.gif" alt="App Builder" decoding="async"></figure>

<figure class="thumbnail-card"><figcaption>Wiki<br>Agent</figcaption><img src="assets/thumbnails/wiki-query-kpi-native.gif" alt="Wiki Query · KPI" decoding="async"></figure>
