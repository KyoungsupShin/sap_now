<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demo | SAP BTP AI</title>
    <link rel="stylesheet" href="sap-template.css" />
    <style>
      :root { --ink:#102a43; }
      * { box-sizing:border-box; }
      html, body { min-width:320px; min-height:100%; margin:0; background:#102a43; font-family:"72 Brand","SAP 72",Arial,sans-serif; }
      .slide { position:relative; width:min(100vw,1600px); min-height:900px; margin:auto; overflow:hidden; background:#fff; color:var(--ink); }
      .brand { position:absolute; top:44px; right:78px; color:#173b5b; font-size:17px; font-weight:600; letter-spacing:-.02em; }
      .brand b, h1 span { color:#0070f2; }
      h1 { position:absolute; top:304px; left:110px; z-index:1; width:650px; margin:0; font-family:"72 Brand Medium","72 Brand","SAP 72",Arial,sans-serif; font-size:48px; font-weight:600; letter-spacing:-.05em; line-height:1.08; }
      .section-label { position:absolute; top:247px; left:110px; z-index:1; margin:0; color:#0070f2; font-size:16px; font-weight:700; letter-spacing:.1em; }
      .geometric-art { position:absolute; top:0; right:0; width:50%; height:100%; object-fit:cover; object-position:center; }
      .footer { position:absolute; z-index:1; left:110px; bottom:30px; color:rgba(255,255,255,.88); font-size:14px; font-weight:600; }
      @media (max-width:800px) { .slide { min-height:100vh; } .brand { top:28px; right:30px; font-size:13px; } .section-label { top:220px; left:30px; } h1 { top:270px; left:30px; font-size:48px; } .footer { left:30px; bottom:18px; font-size:11px; } }
    </style>
  </head>
  <body>
    <main class="slide">
      <div class="brand">SAP BTP AI</div><p class="section-label">21 · DEMONSTRATION</p>
      <h1>Autonomous<br /><span>App-in-App Demo</span></h1>
      <img class="geometric-art" src="assets/sap-template-geometric-half.png" alt="" />
      <span class="footer">SAP | BTP AI Solution Advisory</span>
      <span class="slide-page-number">21</span>
    </main>
  </body>
</html>
